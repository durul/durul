name: README Cards
on:
  # Refresh streak and activity graph every 6 hours
  schedule: [{cron: "30 */6 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/scripts/readme-cards.mjs", ".github/workflows/readme-cards.yml"]

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  readme-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak and activity cards
        run: node .github/scripts/readme-cards.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: durul

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-streak.svg github-activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update README cards - [Skip GitHub Action]"
          # The Metrics workflow may push at the same time; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
